# config/default.toml — Copy to ~/.config/fa/config.toml and customize

[general]
refresh_interval = 30
default_currency = "CNY"

[api_keys]
# alpha_vantage = "YOUR_KEY_HERE"

[data_source]
provider = "sina"
akshare_url = "http://127.0.0.1:8080"

# A股大盘指数 (使用 sh/sz 前缀区分交易所)
[[watchlist]]
symbol = "sh000001"
market = "a_share"

[[watchlist]]
symbol = "sh000300"
market = "a_share"

[[watchlist]]
symbol = "sz399001"
market = "a_share"

[[watchlist]]
symbol = "sz399006"
market = "a_share"

[[watchlist]]
symbol = "sh000016"
market = "a_share"

# 个股示例
[[watchlist]]
symbol = "600519"
market = "a_share"

[[watchlist]]
symbol = "AAPL"
market = "us"

[[portfolio]]
symbol = "AAPL"
market = "us"
quantity = "10"
cost_basis = "1800.00"
